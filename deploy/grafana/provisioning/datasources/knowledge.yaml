# Datasources for the knowledge dashboards (plan §9.3, §15).
apiVersion: 1

datasources:
  - name: Knowledge Prometheus
    uid: kb-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s

  # knowledge.db, read-only. The whole data/ directory is mounted read-only at
  # /data (not the single file, or SQLite's -wal and -shm files would be hidden
  # and recent rows missed), readable by Grafana's user (uid 472).
  - name: Knowledge DB
    uid: kb-sqlite
    type: frser-sqlite-datasource
    access: proxy
    editable: false
    jsonData:
      path: /data/knowledge.db
      pathPrefix: "file:"
      pathOptions: mode=ro
