# Datasources for the knowledge dashboards (plan §9.3, §15).
apiVersion: 1

datasources:
  - name: Knowledge Prometheus
    uid: kb-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s

  # knowledge.db, opened read-only (mode=ro; the plugin also adds
  # _pragma=query_only(1)). The whole data/ directory is mounted at /data (not
  # the single file, or SQLite's -wal and -shm files would be hidden and recent
  # rows missed). The mount is read-write because a WAL reader must be able to
  # create and map the -shm file; mode=ro still stops every write. Grafana's
  # user (uid 472) needs read and write access to the directory.
  - name: Knowledge DB
    uid: kb-sqlite
    type: frser-sqlite-datasource
    access: proxy
    editable: false
    jsonData:
      path: /data/knowledge.db
      pathPrefix: "file:"
      pathOptions: mode=ro
