; Grafana for the house knowledge base (plan §9.3, §14, §15). Draft: KWP11 wires
; it into deploy/docker/compose.knowledge.yaml, mounting
;   deploy/grafana/grafana.ini      -> /etc/grafana/grafana.ini
;   deploy/grafana/provisioning     -> /etc/grafana/provisioning
;   deploy/grafana/dashboards       -> /etc/grafana/dashboards
;   ./data (the directory, not the file) -> /data, mounted READ-WRITE
; knowledge.db is in WAL mode: a reader must be able to create and map the
; -shm file next to it, which a read-only mount prevents when hal-kb isn't
; holding it open. The datasource still opens the database with mode=ro (and
; the plugin adds _pragma=query_only(1)), so Grafana cannot change it. The
; directory must be readable and writable by Grafana's user (uid 472).
; The admin password comes from GF_SECURITY_ADMIN_PASSWORD in .env, never from this file.
; Query Inspector links: set the Live dashboard's kb_url variable to hal-kb's
; address, e.g. link to /d/kb-live?var-kb_url=http://<pi-address>:8910.

[server]
http_port = 3001

[auth.anonymous]
; Grafana requires its own login: it must not bypass the household passcode.
enabled = false

[auth]
disable_login_form = false

[users]
allow_sign_up = false
allow_org_create = false

[security]
disable_gravatar = true
cookie_secure = false
cookie_samesite = strict
allow_embedding = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
; The SQLite datasource for the traces, jobs, regression_runs and eval_runs
; panels, pinned, and installed before provisioning runs (Grafana 12).
preinstall_sync = frser-sqlite-datasource@4.0.6

[unified_alerting]
enabled = true
