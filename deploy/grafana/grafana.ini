; Grafana for the house knowledge base (plan §9.3, §14, §15). KWP11 wires it
; into deploy/docker/compose.knowledge.yaml, mounting
;   deploy/grafana/grafana.ini      -> /etc/grafana/grafana.ini
;   deploy/grafana/provisioning     -> /etc/grafana/provisioning
;   deploy/grafana/dashboards       -> /etc/grafana/dashboards
;   ./data (the directory, not the file) -> /data, READ-ONLY (:ro)
; knowledge.db is in WAL mode. hal-kb's job worker keeps a connection open
; while the service runs, so knowledge.db-wal and -shm exist (owned by
; hal-kb's user) and a mode=ro reader on a read-only mount sees every row,
; including those not yet checkpointed. Do NOT mount data/ read-write: while
; hal-kb is stopped, a mode=ro reader in a writable directory creates -wal and
; -shm itself, owned by Grafana's uid 472, and when hal-kb starts again it can
; no longer write ("attempt to write a readonly database"). With the read-only
; mount, while hal-kb is stopped (no -wal/-shm to read through) the SQLite
; panels show "unable to open database file" until hal-kb is back.
; knowledge.db (and the directory) must be readable by uid 472.
; The admin password is GRAFANA_ADMIN_PASSWORD in .env, which compose passes to
; Grafana as GF_SECURITY_ADMIN_PASSWORD; never put it in this file.
; Query Inspector links: set the Live dashboard's kb_url variable to hal-kb's
; address, e.g. link to /d/kb-live?var-kb_url=http://<pi-address>:8910.

[server]
http_port = 3001

[auth.anonymous]
; Grafana requires its own login: it must not bypass the household passcode.
enabled = false

[auth]
disable_login_form = false

[users]
allow_sign_up = false
allow_org_create = false

[security]
disable_gravatar = true
cookie_secure = false
cookie_samesite = strict
allow_embedding = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
; The SQLite datasource for the traces, jobs, regression_runs and eval_runs
; panels, pinned, and installed before provisioning runs (Grafana 12).
preinstall_sync = frser-sqlite-datasource@4.0.6

[unified_alerting]
enabled = true
