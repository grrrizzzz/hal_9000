[project]
name = "hal9000"
version = "0.1.0"
description = "HAL 9000: a GAME-framework coordinator with a solar-monitoring agent and a fault-triage sub-agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Loads .env so `cp .env.example .env` -- which this repo's docs and its
    # own error message both instruct -- actually works. Without it that
    # advice is circular: a directory holding a valid .env still fails with
    # "no provider configured, copy .env.example to .env".
    "python-dotenv>=1.0",
    "litellm>=1.63",
    "pydantic>=2.6",
    "httpx>=0.27",
    "websockets>=12.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pvlib>=0.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.scripts]
hal9000 = "hal9000.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "hypothesis>=6.100",
    "openapi-spec-validator>=0.7",
    "reportlab>=5.0.1",
]
# House knowledge base (plan KNOWLEDGE_PLAN.md §3.1, §4). The base group must
# stay lean enough for the Pi (< 300 MB, rule K11); heavy extras are separate
# groups, imported lazily, so `import hal9000.knowledge` never needs them.
knowledge = [
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "selectolax>=0.3.21",
    "tiktoken>=0.7",
    # Pinned: the version verified on x86_64 and aarch64 Linux (gate G-K0b).
    "sqlite-vec==0.1.9",
    "sse-starlette>=2.1",
    "prometheus-client>=0.20",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]
knowledge-docling = ["docling>=2.0"]
knowledge-rerank = ["fastembed>=0.4"]
eval = ["rapidfuzz>=3.9", "numpy>=1.26"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hal9000"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The coverage gate runs on every `uv run pytest`, locally and in CI, rather
# than living in a separate command someone has to remember. 85% is the floor
# from BUILD_PLAN DoD #2; the suite currently sits well above it, and the gap is
# headroom for honest untestable lines (`if __name__ == "__main__"`), not slack
# to spend. If this gate ever fails, the fix is a test -- not a lower number.
addopts = "-q --cov=hal9000 --cov-report=term-missing:skip-covered --cov-fail-under=85"
markers = [
    "live: hits a real LLM provider; auto-skipped when no API key is present",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# Markdown is documentation, not source: ruff 0.16+ would otherwise reformat
# the deliberately abbreviated code samples in docs/.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# zip() over the 24 hours of a day: the lengths are fixed by construction
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["hal9000", "tests"]
