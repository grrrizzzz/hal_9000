[project]
name = "hello-agent"
version = "0.1.0"
description = "A GAME-framework agent template: a guestbook greeter you can read in one sitting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Loads .env so `cp .env.example .env` -- which this repo's docs and its
    # own error message both instruct -- actually works. Without it that
    # advice is circular: a directory holding a valid .env still fails with
    # "no provider configured, copy .env.example to .env".
    "python-dotenv>=1.0",
    "litellm>=1.63",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The coverage gate runs on every `uv run pytest`, locally and in CI, rather
# than living in a separate command someone has to remember. 85% is the floor
# from BUILD_PLAN DoD #2; the suite currently sits well above it, and the gap is
# headroom for honest untestable lines (`if __name__ == "__main__"`), not slack
# to spend. If this gate ever fails, the fix is a test -- not a lower number.
addopts = "-q --cov=hello_agent --cov-report=term-missing:skip-covered --cov-fail-under=85"
markers = [
    "live: hits a real LLM provider; auto-skipped when no API key is present",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# Markdown is documentation, not source: ruff 0.16+ would otherwise reformat
# the deliberately abbreviated code samples in docs/.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["hello_agent", "tests"]
